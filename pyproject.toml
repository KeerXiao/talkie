[project]
name = "talkie"
version = "0.1.0"
description = "Push-to-talk dictation through OpenRouter"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "numpy>=2.5.2",
    "openai>=3.19.2",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "pywebview>=6.2.1",
    "requests>=2.34.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
talkie = "talkie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkie"]
# Tests sit beside the code they cover (Go style); they must not ship.
exclude = ["**/*_test.py"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
