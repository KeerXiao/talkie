[project]
name = "talkie"
version = "0.1.0"
description = "Push-to-talk dictation through OpenRouter or OpenAI"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "numpy>=2.5.2",
    "openai[realtime]>=3.19.2",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "pywebview>=6.2.1",
    "requests>=2.34.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
talkie = "talkie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkie"]
# Tests sit beside the code they cover (Go style); they must not ship.
exclude = ["**/*_test.py"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
# A hang is worse than a failure here: the suite exercises a hotkey loop, a
# microphone and WebSockets, so a test that blocks leaves a process holding the
# real hotkey. Two of those once survived for two days. The slowest honest test
# is ~5s, so 60 is generous.
#
# `thread` rather than the default signal method: signals do not land while the
# main thread sits in a native call, which is exactly how the worst hangs look
# (see DESIGN 8 on Cocoa and Ctrl+C).
timeout = 60
timeout_method = "thread"
